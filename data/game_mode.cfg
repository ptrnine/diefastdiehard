// Game modes: sets of game rules, one section per mode (gm_ prefix).
// Applied from the console with "game mode [name]"; gm_default is used on start.
//   bullet_gravity    - bullet gravity y value, 0 = bullets fly straight
//   crate_drop_period - crate drop cooldown period (seconds), 0 = crates never drop

[gm_default]
bullet_gravity = 0
crate_drop_period = 0

[gm_crates]
bullet_gravity = 0
crate_drop_period = 5

[gm_ballistic]
bullet_gravity = 500
crate_drop_period = 5
