# Game modes: sets of game rules, one section per mode (gm_ prefix).
# Applied from the console with "game mode [name]"; gm_default is used on start.
#   bullet_gravity    - bullet gravity y value, 0 = bullets fly straight
#   crate_drop_period - crate drop cooldown period (seconds), 0 = crates never drop
#   magazines_count   - magazines of a gun (ammo = mag_size * magazines_count), 0 = unlimited.
#                       Pistols are always unlimited, an emptied gun is dropped
#   score_system      - what the player score counts (switching game modes resets the scores):
#                       default - kills: +1 for a kill, -1 for a suicide
#                       lives   - lives: -1 for any death, a player without lives is out of the game
#   start_lives       - lives score system: lives on start (default 3)

[gm_default]
bullet_gravity = 0
crate_drop_period = 0
magazines_count = 3

[gm_crates]
bullet_gravity = 0
crate_drop_period = 5
magazines_count = 3

[gm_ballistic]
bullet_gravity = 500
crate_drop_period = 5
magazines_count = 3

[gm_lives]
bullet_gravity = 0
crate_drop_period = 5
magazines_count = 3
score_system = lives
start_lives = 3
